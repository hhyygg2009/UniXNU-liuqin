# liuqin 的源码固定。规范：unixnu.com/zh/porting/device-repository#feedstoml
#
# 现状说明（不假装已完成）：本仓仍是 schema 1，驱动以 **git 子模块** 固定，SoC 支持内联在
# 设备仓与驱动仓里，还没有 UniXNU-sm8475-common 这样的共享 SoC 仓，所以这里不编造
# kind = "soc" 条目。board.soc_source 与 [components] 的引入是 schema 2 迁移的一部分，
# 已记在 porting.toml 的待办里（"Migrate board.toml to schema_version = 2 … re-verify
# kernel, firmware, payload and bootimg end to end"）。

# 板级 UFS/SMMU/根存储驱动：与 .gitmodules 的 url/branch 和 gitlink 提交一致。
# 核对方式：git submodule status drivers/ShengUfs；改驱动后必须更新这个 gitlink，
# 否则 unixnu 会静默检出上一个提交（本仓 v56 记录里写过这条教训）。
[[source]]
kind = "driver"
name = "ShengUfs"
git = "https://github.com/Fly116/ShengUfs.git"
ref = "liuqin-sm8475-v56"
commit = "26ae865ea31492cb9f156621a04acc2effff1092"

# schema-2 迁移试验（分支 soccarrier-trial）：把社区已有的 SM8475 SoC 载体钉成 kind = "soc"。
# 候选与实测见 porting.toml configuration；本条先试 a77710178a/UniXNU-sm8475-common，
# 它的 dts/sm8475.dtsi 里 14 个 reg 首元全部出现在本板厂商 DT（dts/liuqin.dts）里。
[[source]]
kind = "soc"
name = "sm8475"
git = "https://github.com/document97/UniXNU-soc-seed"
