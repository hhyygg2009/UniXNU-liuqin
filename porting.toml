components = []
paths = ["package/ShengPlatformPower.cpp", "scripts/build-sheng-platform-power.py", "scripts/build-software-aes-bindings.py"]
inputs = [
    "PMIC/PMGR register access and the watchdog contract measured from the stock firmware.",
    "AppleKeyStore state inputs for the AES bindings (NativeAES plus software fallback).",
]
configuration = [
    "boot args pmgr=2, sheng-disable-watchdogd=1, sheng-aks=1, boot-diag-resume=0, sheng-gpu-power=9.",
    "Archive 07 builds the sheng platform-power provider, archive 08 the software AES bindings.",
]
