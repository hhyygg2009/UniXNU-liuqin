[[area]]
id = "packaging"
status = "device-verified"
components = ["XnuPrelink", "SoftwareAES"]
paths = ["scripts/pack-bootimg-liuqin.sh", "scripts/wrap-payload-mbr.py", "scripts/build-liuqin-ufs-bindings.py", "scripts/patch-xnu-entry-probe.py", "scripts/make-liuqin-adt.py", "patches/**"]
inputs = [
    "iPadOS 17.7.11 / 21H461 kernelcache as the prelink base, with --slide=-0x1000000.",
    "The 27 selected roots plus the early-security-init pin com.apple.driver.AppleMobileFileIntegrity=0xfffffff005ab4ae0.",
    "FD, BootShim and the Cape DTB for the final image.",
]
configuration = [
    "[kernel.prelink] roots and [bootimg] in board.toml; payload size_mib=64 with volume LIQUNESP.",
    "trust_cache_sha256 and the ADT inputs recorded in [payload.adt].",
]
procedure = [
    "./unixnu build kernel && ./unixnu build payload --kernel out/liuqin/kernel/kernel.macho --unique-chip-id 0x84750A0B0C0D0001",
    "python3 scripts/wrap-payload-mbr.py out/liuqin/payload/payload.img out/liuqin/payload/payload-mbr.img",
    "./unixnu bootimg --fd ../uefi-liuqin/Build/liuqinPkg/DEBUG_CLANGPDB/FV/SILICIUM_UEFI.fd --dtb ../uefi-liuqin/Resources/DTBs/liuqin.dtb --ramdisk out/liuqin/payload/payload-mbr.img",
]
findings = [
    "A reproducible size check exists for the packing: v36c, v37 and v38 are all exactly 69,525,504 bytes. A 68,476,928-byte image means the MBR wrap step was skipped and the raw 64 MiB payload was used, and PartitionDxe then cannot see the ESP.",
    "The patch series is replayed exactly once, guarded by .cache/xnu-work/.patches.sha256; editing any patch (as H16-D to H16-E did) changes the stamp and rebuilds the tree, which is how the v38 image was proven to contain the new scan.",
    "Payload-side injection is verified byte-wise: the panic screen is 0xa0f bytes at fffffff00741e500 in the zero-filled region, hooked from _panic and _panic_trap_to_debugger.",
    "The build is reproducible and board.toml additions are inert under schema 1: after [board] os_profile and [components] include were added for this record, a dry-run rebuild produced the byte-identical kernel.macho sha256 49247f07d0dd1fd13a7749d433b20895808ab45994c39b19349ee27bcbf8f76b.",
    "In-image verification of a kernel patch is done by disassembling the shipped binary, not the object: postModLoad base fffffff0078926a0 with the new call sites at +0x17c, +0x33c, +0x368 and +0x48c, and the diagnostic format strings present in kernel.macho.",
]
completion = [
    "Kernel and prelink succeed, payload contains all declared inputs, and the boot image matches the bootloader format and size limit.",
]
limits = [
    "Images are only ever loaded with fastboot boot; nothing is flashed, so there is no persistence test of the packaging across reboots.",
]
next_action = [
    "Keep recording the kernel.macho and boot.img sha256 per round in docs/boot-rounds-v35-v40.md so evidence revisions stay tied to a byte-exact image.",
]
evidence = [
    { kind = "source", reference = "scripts/wrap-payload-mbr.py", result = "Produces the 65 MiB MBR-wrapped payload the firmware's PartitionDxe requires." },
    { kind = "host", command = "./unixnu build kernel && ./unixnu build payload --kernel out/liuqin/kernel/kernel.macho --unique-chip-id 0x84750A0B0C0D0001 && ./unixnu bootimg --fd ... --dtb ... --ramdisk out/liuqin/payload/payload-mbr.img", revision = "1db66fc55c1582d5483ff882456a142e8f972133", reference = "README.md", result = "boot.img 69,525,504 bytes, sha256 08a01ee150dd0979f99905b278d9b5c66434c1352d7e5b9b23f6e3de0efd2068; kernel.macho sha256 49247f07d0dd1fd13a7749d433b20895808ab45994c39b19349ee27bcbf8f76b" },
    { kind = "device", command = "fastboot boot boot-liuqin-v38-chain-dump.img", revision = "1db66fc55c1582d5483ff882456a142e8f972133", reference = "docs/boot-rounds-v35-v40.md", result = "Sending boot.img OKAY, Booting OKAY, and the kernel runs to the mount decision." },
]

[[area]]
id = "diagnostics"
status = "device-verified"
components = []
paths = ["scripts/check-liuqin.py", "scripts/audit-h16f-image.py", "tests/metaclass-simtest/**", "tests/liuqin_usb_host_test.c", "docs/liuqin-usb-debug.md", "patches/xnu/zzz-liuqin-usb-debug*.patch", "docs/boot-rounds-v35-v40.md"]
inputs = [
    "Panel milestone console (prefixes K, B, U, I, T and M), a 1 MiB log ring and a USB CDC-ACM debug port (LIQDBG001).",
    "Host-side toolchain: llvm-nm/llvm-objdump against the unstripped kernel for offline symbolization.",
]
configuration = [
    "boot args startup_debug=1, native-ufs-diagnostics=1, armcpu-diagnostics=1, boot-progress=2, debug=0x14e, -no_slto_panic.",
    "panic_screen_only=true in [payload] so kernel panics reach the panel.",
]
procedure = [
    "fastboot boot <image>, then photograph the panel; read the ring over the USB debug port when a serial capture is needed.",
    "python3 tests/liuqin_usb_host_test.c build via tests/run-host-test.sh for the debug-port logic.",
    "tests/metaclass-simtest/run.sh for the metaclass scan behaviour.",
]
findings = [
    "Offline symbolization is the core technique: the panel gives pc/lr/far and a frame list, and the unstripped kernel maps them to functions and exact instructions. That is how postModLoad+0x2d4 became 'the first hop of the depth walk, reached through the no-duplicate branch'.",
    "Register values are decoded as data, not just addresses: far = x24 + 0x10 confirmed the faulting ldr, and x24 = 0x6131373030666666 decoded as the ASCII bytes 'ffff007a' proved the poisoned field held console text.",
    "Diagnostics must be printed last: the panic screen redraws the panel and keeps only the final console lines, so the v38 scan summary is the last line emitted on purpose.",
    "The milestone console never touches storage or locks, so it survives the hang cases that lose the log ring; the USB port adds the full 1 MiB ring when a photograph is not enough.",
    "A search of the console mirror must answer for its own output: the report prints the needle verbatim inside its asc=\"...\" field whenever the bytes are printable, so searching after printing finds that line, and a self-hit is worse than no hit because it carries a real offset. Search first, then print, and classify any candidate whose preceding 32 bytes contain the asc= field or the bad= field as self=.",
    "lq_copy clamps a position older than the ring forward to the oldest byte it still holds, so a hit offset has to be taken from pos - got (where the chunk really started), never from the position that was asked for; the difference is the difference between pointing at a line and pointing into memory that was overwritten. The same jump is the only signal that early output is gone, which is why the verdict distinguishes lost from clean from gaveup.",
    "Evidence printed during the scan cannot be assumed to survive to the photograph: the panic screen keeps only the last lines, so the witness at pub replays the last producer line rather than hoping it is still there.",
]
completion = [
    "Each claimed milestone has a reproducible command, a matching source/image revision and an accessible result.",
]
limits = [
    "There is no kernel debugger session; kdb is configured over serial but never attached, so everything is post-mortem from photographs and the ring.",
]
next_action = [
    "v39 shipped that bracket as M:mc pre / M:mc pub rather than M:reg: the driver re-reads superClassLink on entry to startRoot and again once every root window is prepared, repairs it in place and prints was=/now=, so one pair of photographs says whether the scribble continues after restartable_init.",
]
evidence = [
    { kind = "source", reference = "docs/liuqin-usb-debug.md", result = "The debug port contract: switch, the four self-test gates and the porting comparison table." },
    { kind = "host", command = "tests/metaclass-simtest/run.sh", revision = "cbbb7b13e5ebe51bd2f02c716455d04f37feacfe", reference = "tests/metaclass-simtest/sim.cpp", result = "ALL SIM ASSERTIONS PASS (scenarios A, B, C and the new D)." },
    { kind = "source", reference = "tests/metaclass-simtest/README.md", revision = "8c391866a0acb3a0c24da45e32b444a9372bac5a", result = "The harness now runs five extracted includes: three from the driver and two from the XNU patches (the 1 MiB ring itself and the libkern fingerprint call site), plus the mirror model -- liuqin_debug_puts appends then paints, liuqin_debug_copy returns 0 when the lock is held -- and two assertion channels, the mirror for what was printed and a 512-byte panel for what a photograph could still show." },
    { kind = "host", command = "python3 scripts/audit-h16f-image.py", revision = "f78ad26ba7a765dadc7af9317574f8b8a923dd00", reference = "scripts/audit-h16f-image.py", result = "H16-F AUDIT PASS: 5 symbols, 7 console format strings, 6 disassembly facts inside postModLoad, 4 inside the metaclass constructor. The one-command form of 'prove it by disassembly', written for the rounds when the tablet is not on the bench." },
    { kind = "host", command = "python3 scripts/audit-h16f-image.py", revision = "8c391866a0acb3a0c24da45e32b444a9372bac5a", reference = "scripts/audit-h16f-image.py", result = "42 checks, and the windows are now cut at symbol boundaries instead of guessed lengths: a guessed window had already been able to borrow a neighbouring function's blr and pass." },
    { kind = "device", command = "fastboot boot boot-liuqin-v38-chain-dump.img", revision = "1db66fc55c1582d5483ff882456a142e8f972133", reference = "docs/boot-rounds-v35-v40.md", result = "M:stalled pre/post, M:bad[170] and M:stalled scan BAD lines legible on the panel, plus the panic screen with pc/lr/far, registers and frames." },
]

