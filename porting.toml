[[area]]
id = "storage"
status = "device-verified"
components = ["ShengUfs", "VirtioMmioBlock", "VerifiedRoot"]
paths = ["drivers/ShengUfs", "scripts/build-liuqin-ufs-bindings.py", "scripts/build-arm-driver.py", "docs/porting-plan.md", "tests/metaclass-simtest/**", "docs/ufs-tur-analysis-2026-11-22.md", "docs/ufs-investigation-2026-11-22.md", "docs/make-phy-tables.py"]
inputs = [
