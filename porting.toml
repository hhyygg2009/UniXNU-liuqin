schema_version = 1

# Structured porting record for the Xiaomi Pad 6 Pro (liuqin, SM8475).
# Identity fields must match board.toml; check with
#   python3 ../UniXNU/scripts/porting-record.py check --device ../UniXNU-liuqin
# Evidence revisions are full 40-character commits of this repository.

[device]
name = "liuqin"
soc = "SM8475"
os_profile = "ipados-17.7.11-21H461"
summary = "Boots the 21H461 XNU kernel from UEFI on real hardware through to the root mount decision; UFS reads and the userdata window are device-measured, the root volume is not mounted yet."

[[area]]
id = "configuration"
status = "device-verified"
components = ["ArmDTPlatform"]
paths = ["board.toml", "configs/**", "package/**", "patches/**", ".github/**", ".gitignore", ".gitmodules", "scripts/**", "tools/**", "README.md", "AGENTS.md", "porting.toml", "feeds.toml", "unixnu.lock", "local.toml.example", "proprietary-files.txt", "dts/**", "stubs/**", ".cache/firmware/**", "docs/fly116-pr1-readme.md", "docs/bringup-2026-11-21-local-merge.md"]
inputs = [
    "Stock firmware package liuqin_images_OS3.0.7.0.VMYCNXM_20260514.0000.00_15.0_cn (HyperOS 15, SM8475).",
    "iPadOS 17.7.11 / 21H461 restore image iPad_Pro_HFR_17.7.11_21H461_Restore.ipsw for the kernel and prelink inputs.",
    "Linux host toolchain from scripts/linux/setup-toolchain.py, kept in the project tree at ../toolchain (its CommandLineTools/usr/bin/ld is what the kernel step needs).",
]
configuration = [
    "board.toml [board] name=liuqin soc=SM8475 kit=liuqin.",
    "[kernel] defconfig=liuqin_boot_defconfig (the truth as of f68b571, guarded by scripts/check-defconfig.py: declared == selected == out/liuqin/.config) and the schema-1 [kernel] archives list: corecrypto-14 (twice, second namespaced), ArmDTPlatform, ArmCpu, libpthread-kernel, NativeAES, sheng platform-power, software AES bindings, NativeUfs, liuqin UFS bindings.",
    "[kernel.prelink].roots selects 27 kexts that are linked into the closure, including com.apple.iokit.IOStorageFamily.",
    "[payload] volume=LIQUNESP, size_mib=64, loader=firmware, timeout=15000, ui_scale=2, panic_screen_only=true.",
    "[userdata] first_lba/last_lba/lba_bytes plus the window list; last_lba is taken from the device's own GPT rather than the vendor value.",
]
procedure = [
    "cd ../UniXNU && export UNIXNU_DEVICE=$PWD/../UniXNU-liuqin UNIXNU_UEFI=$PWD/../uefi-liuqin UNIXNU_EDK2=$PWD/../uefi-liuqin/Mu_Basecore UNIXNU_TOOLCHAIN=$PWD/../toolchain",
    "./unixnu build kernel",
]
findings = [
    "The roots list was inherited from the sheng iOS 27 profile; the official iOS 17.7.11 profile does not list IOStorageFamily, so the family is prelinked here and registers IOBlockStorageDevice inside the __kernel__ metaclass batch. That is the whole background of the H16 crash family.",
    "The kernel command line has to stay under 1000 bytes; offline-legacy-* and boot-ui-focus arguments were traded against each other to keep it there (commit 57b2d3c series). v43 adds amfi_get_out_of_my_way=1 and cs_enforcement_disable=1 and lands at 967 bytes.",
    "TRAP (found while diagnosing H17): board.toml declares defconfig = liuqin_defconfig, but the config the build actually uses is out/liuqin/.config, and that file is byte-identical to configs/liuqin_boot_defconfig (written by an explicit 'unixnu defconfig liuqin_boot' on 2026-11-16 and never regenerated). The two differ exactly where it hurts: CONFIG_XNU_TRUST_CACHE_RUNTIME and CONFIG_XNU_BOOT_PROGRESS. So a defconfig edit can be silently inert -- verify a CONFIG_XNU_* switch in the image (is its bootstrap string present, is its function called) before reasoning from it.",
    "New device patches sort by name into the replayed series, so a patch's file name is part of its correctness: zzzz-liuqin-trust-cache-lock-init.patch has to sort after every patch that touches osfmk/kern/startup.c, otherwise exporting it from the working tree bakes the earlier hunks into it and the replay collides. scripts/sync-xnu-patches.sh keeps it by name.",
    "TRAP (2026-11-20): the driver submodule has to keep origin = https://github.com/UniXNU/ShengUfs.git. unixnu tree only creates the legacy alias drivers/NativeUfs (and build/native-ufs/libNativeUfs.a) when components.official_alias() accepts the module identity, and [kernel].archives names the legacy one -- so pointing origin at a fork (Fly116 / hhyygg2009) makes archive-09 die with \"clang: error: no such file or directory: .../tree/drivers/NativeUfs/NativeUfs.cpp\", an error a full layer away from its cause. The fork stays reachable as remote \"mine\" and the maintainer as \"fly116\", while .gitmodules keeps pointing at the fork so the recorded commits resolve publicly.",
    "Schema 1 keeps archives and roots inline in board.toml, so there is no component resolution at build time. [components] include is recorded here for the documentation catalogue only; the schema-1 build path never reads it.",
    "Schema 2 is blocked by an unmade choice, not by a missing input and not by a field edit (measured 2026-11-21 on branch schema2, commit 00a131d26ec1): the builder itself refuses with 'unixnu: schema_version = 2 requires [board] soc_source and os_profile'. os_profile is present. The UniXNU organisation carries no SM8475 common repository (only UniXNU-sm8550-common), which is what the first look concluded -- but three community SM8475 carriers are published and each is pin-able as feeds kind = 'soc': a77710178a/UniXNU-sm8475-common cd36e7097899 (soc.toml [soc] name = sm8475 plus a two-entry soc series: native-smp-secondary.patch, platform-power.patch, and dts/sm8475.dtsi with configs/sm8475.config), Emilelu/UniXNU-sm8475-common c5b50c3927a5 (same layout, series present), and document97/UniXNU-soc-seed e0030d06d78d path migration/format2/soc-seed (soc.toml with [components] include = [] and an empty series; that is what the other format-2 liuqin entry in the catalogue pins). So the open question is which carrier's register, interrupt, CPU and timer facts match this board's own measurements in docs/liuqin-hardware.md -- and whose dtsi can compile to a DTB equivalent to the vendor liuqin.dtb pinned in proprietary-files.txt. The schema-1 build stays usable meanwhile, and os_profile plus [components] are read only by the record checker and the documentation catalogue.",
    "Ownership audit after the carrier trial: comparing the tracked non-document files against the union of every active area's paths found ten files no area owned -- feeds.toml, unixnu.lock, local.toml.example, proprietary-files.txt, dts/liuqin.dts, stubs/kernel-stub.macho, tests/run-host-test.sh and three entries under .cache/firmware. Two of those were a real defect rather than bookkeeping: .cache/firmware/kernelcache.macho/kernelcache.release.ipad7.decompressed was committed as a symlink pointing at an absolute path on the maintainer's machine (/home/hhyygg/.dsh-qqbot/workspace/unixnu-port/UniXNU/out/ipsw/21H461/kernelcache.decompressed), and the trust-cache bundle with its json were committed binaries that proprietary-files.txt already pins by sha256 (7416ca4f8377146626bb284e2133c76bee6cb4e3ee0af5d648b186235a7323a7 and d73826a7eb1de0e445100c9512ad938fe1c6ff84c96c24e20704bb5b55a35243) and that scripts/fetch-liuqin-trust-caches.py regenerates from the pinned 21H461 restore image. The device-repository spec puts proprietary inputs in .cache/firmware in the working tree and says not to copy them into the repository, so .cache is now ignored and untracked: the files stay on this machine, so the current build is untouched, while a clean checkout no longer resolves a foreign absolute path or ships Apple-derived blobs. Ownership patterns were added for the rest (feeds/unixnu.lock/local.toml.example/proprietary-files.txt/dts/stubs under configuration, tests/run-host-test.sh under diagnostics), plus .cache/firmware/** so the removal itself has an owner: check_changes asks every changed path, deletions included, to resolve to an area, which is exactly how this gap surfaced twice. Note the published history still contains those blobs; removing them from the commits is a separate, explicit decision.",
    "The v66 round exposed a guard-vs-image divergence that has to be fixed before the next switch flip means anything: audit-h16f-image.py reports AUDIT FAILED (6) because _liuqin_base_class_probe has no address in the image and three NativeUfs strings (metaclass chain broken / base class live size / is held by) are absent, which also collapses its K/Q/P/C windows; check-trust-cache-image.py reports FAILED (1/21) with only 'T payload.json reports that same bundle = None', while its own P group finds 'amfi interface not available' once in the same image. Two guards disagree about one string, so the audit's expectations are behind the current patch set rather than the image being wrong -- and the bundle field is genuinely missing from payload.json after the 17:10 repackage.",
    "README was restructured on 2026-11-21 to match what the spec asks of it -- scope, dependencies, build entry points and a link to this record -- and nothing more: 949 lines / 68 KB down to 186 lines / 13.5 KB and then 128 lines / 8.9 KB. The 600-line PR #1 appendix (Fly116's verbatim sections 0-13 plus his acknowledgments and the AI usage table) moved to docs/fly116-pr1-readme.md with its provenance note, so no content was deleted, only relocated; the two progress sections collapsed into a one-line-per-round timeline that points at docs/boot-rounds-v35-v44.md and the bringup notes, and the compliance cells lost their essays because porting.toml limits/next_action is the authoritative place for them. The one section whose facts existed nowhere else -- the unpushed local line and its two vetoes -- also moved out verbatim into docs/bringup-2026-11-21-local-merge.md, which now additionally records the three facts that had no other home: the uncovered amfi == NULL guard at kern_trustcache.c:630, the decision not to retire the M:stalled diagnostic patch (v60 shipped with it and section 3.7 depended on its two lines), and the carve script plus its rollback GPT pair that live only on the build machine. The second pass merged the file map with the dependency table, collapsed the fourteen timeline rows into seven ranges and joined the compliance and publishing tables; every number that only lived in the README was re-checked afterwards and is still there (69,525,504 / 68,476,928 / 980 / 976 / namespace 9 code 0x8 / d8b80295 / ce90f88b / 26ae865e / 4fc7f56 / cbbb7b1 / 19562650 / 0 unowned). Note the commit message of the second pass says 106 lines, which was an estimate: the file is 128 lines, and history was not rewritten to fix that wording -- this finding is the correction. Three claims were corrected against measurement while doing it: the tablet does not always come back to fastboot immediately (v67 vanished from USB for ten-plus minutes first), v44 was the bench image of its time rather than the current one, and the record checker path is ../UniXNU/scripts/porting-record.py."
]
completion = [
    "Every source pin resolves, the selected component set is recorded, and the patch order is reproducible from the .patches.sha256 stamp.",
]
limits = [
    "board.toml is still schema_version 1, so the documentation catalogue keeps this repository as a format-1 entry -- a repository link and no generated device page -- even though a valid porting.toml is published next to it. The cause is the unpicked SoC carrier above, not a missing record.",
    "Schema 2 additionally needs os_overrides, feeds pins, the package layout and a dts/ entry the resolver can compile; none of that has been verified end to end.",
]
next_action = [
    "Repo layout completed to the device-repository spec on 2026-11-21 (patches/xnu/series with the 60 device patches in replay order, feeds.toml pinning the driver source, proprietary-files.txt with locally measured hashes, dts/liuqin.dts as a decompiled review view of the vendor DTB, scripts/package.sh copied verbatim from UniXNU/templates, local.toml.example, .gitignore no longer ignoring unixnu.lock). NOT done: scripts/package.sh has never been run here (it needs the schema-2 resolver and a macOS runner), so the packaging area carries no run record, and unixnu fetch/unixnu.lock are still missing because the fetch wants the GitHub driver source over a broken local proxy.",
    "Choose and verify an SM8475 SoC carrier instead of inventing one: cross-check the three published candidates against docs/liuqin-hardware.md (GIC ranges, CPU affinity and enabled cores, 19.2 MHz timer, reserved regions), pin the winner in feeds.toml as kind = 'soc' with its full commit, set board.soc_source, compile its dtsi to a DTB and diff it against the vendor liuqin.dtb, then flip schema_version = 2, re-base the four same-named patches, and re-verify kernel, firmware, payload and bootimg end to end -- schema 2 also adds six upstream patches, so the kernel changes and an unverified flip is not publishable. Trial evidence for the round that found this: branch schema2 at 00a131d26ec120753edeba3628a77554f3a77f48.",
]
evidence = [
    { kind = "source", reference = "board.toml", result = "Board identity, archives, roots, payload and userdata values as listed above." },
    { kind = "host", command = "./unixnu build kernel", revision = "1db66fc55c1582d5483ff882456a142e8f972133", reference = "https://github.com/hhyygg2009/UniXNU-liuqin", result = "rc=0, kernel.macho sha256 49247f07d0dd1fd13a7749d433b20895808ab45994c39b19349ee27bcbf8f76b" },
    { kind = "device", command = "fastboot boot boot-liuqin-v38-chain-dump.img", revision = "1db66fc55c1582d5483ff882456a142e8f972133", reference = "docs/boot-rounds-v35-v44.md", result = "Panel shows the config line, the UniXNU boot menu and the kernel milestones, so the recorded configuration reaches the device." },
    { kind = "source", reference = "patches/xnu/attic/2026-11-19-h17-trust-cache-lock-init.patch", revision = "2a9cb962d64277a644e641fff6f9d2d75f6f3996", result = "H17: the trust-cache lock is initialised (and the query answers KERN_NOT_FOUND with no amfi interface) on the branch this configuration actually compiles." },
    { kind = "host", command = "grep -c trust_cache_init kernel.macho; llvm-nm kernel.macho | grep trust_cache_runtime_init; objdump scan for bl _trust_cache_runtime_init", revision = "ee2b5a8388f8038fd37e992e159a600f0e7cfeab", reference = "docs/boot-rounds-v35-v44.md", result = "The compiled-out block proven from the image: the string is absent, the function is linked at 0xfffffff00775e858 and nothing branches to it -- so the non-sleepable lock was never initialised anywhere." },
    { kind = "host", command = "python3 -c 'import tomllib;print(len(\" \".join(tomllib.load(open(\"board.toml\",\"rb\"))['payload']['kernel_args'])))'", revision = "2a9cb962d64277a644e641fff6f9d2d75f6f3996", reference = "board.toml", result = "967 bytes of kernel args, inside the 1000-byte ceiling, after adding the two code-signing bring-up switches." },
    { kind = "host", command = "git -C drivers/ShengUfs remote set-url origin https://github.com/UniXNU/ShengUfs.git && ./unixnu tree && ls -l out/liuqin/tree/drivers/NativeUfs", revision = "04c7ea12d56aefe599b79fd5ebee23e854291974", reference = "AGENTS.md", result = "Repaired: with the official origin identity the alias comes back (drivers/NativeUfs -> drivers/ShengUfs) and archive-09 compiles again. It had been broken since the 2026-11-19 22:44 test-pr1 checkout, which repointed origin at the maintainer repository." },
    { kind = "host", command = "./unixnu build payload --kernel out/liuqin/kernel/kernel.macho --unique-chip-id 0x84750A0B0C0D0001 && python3 scripts/wrap-payload-mbr.py && ./unixnu bootimg && cmp against releases/boot-liuqin-v44-no-cs-disable.img", revision = "04c7ea12d56aefe599b79fd5ebee23e854291974", result = "The restored main line repacks to a boot.img that differs from the released v44 in 71 of 69,525,504 bytes: the FAT volume timestamps and chosen/random-seed in the ADT (random by design). Same kernel sha256 e8233d2e, audit 64/64 PASS -- the bench image is reproducible.", reference = "docs/trust-cache-plan.md" },
    { kind = "host", command = "./unixnu status --json -D <device repository> --out <scratch output directory> (schema_version = 2 trial on branch schema2)", revision = "00a131d26ec120753edeba3628a77554f3a77f48", reference = "https://github.com/hhyygg2009/UniXNU-liuqin/blob/00a131d26ec120753edeba3628a77554f3a77f48/board.toml", result = "rc != 0: 'unixnu: schema_version = 2 requires [board] soc_source and os_profile'. This is the missing input recorded in limits and the reason main stays schema 1." },
    { kind = "source", reference = "https://github.com/a77710178a/UniXNU-sm8475-common/blob/cd36e709789940bb10479dd5e1b7420b54687992/soc.toml", result = "A published SM8475 SoC layer exists and is schema-2 shaped: soc.toml declares [soc] name = sm8475, and the repository also ships patches/xnu/series with two entries, dts/sm8475.dtsi and configs/sm8475.config. Together with Emilelu/UniXNU-sm8475-common (c5b50c3927a5) and document97/UniXNU-soc-seed (e0030d06d78d, path migration/format2/soc-seed, empty [components] and series) this is the candidate set for board.soc_source; none of them has been cross-checked against this board yet." },
    { kind = "host", command = "python3 -c 'import tomllib,fnmatch,subprocess as sp;a=[x[\"paths\"] for x in tomllib.load(open(\"porting.toml\",\"rb\"))[\"area\"] if x[\"status\"]!=\"not-applicable\"];f=[p for p in sp.run([\"git\",\"ls-files\"],capture_output=True,text=True).stdout.split() if not p.endswith((\".md\",\".rst\")) and p!=\"porting.toml\"];print(len(f),\"tracked non-document files;\",[p for p in f if not any(fnmatch.fnmatchcase(p,x) for ps in a for x in ps)])'", revision = "d6fa03f862e4647f158acbf6860164b9ae1a662a", reference = "porting.toml", result = "Before the paths additions: 144 tracked non-document files, 10 unowned -- .cache/firmware/kernelcache.macho/kernelcache.release.ipad7.decompressed, .cache/firmware/trustcache/original-static-system.bundle, .cache/firmware/trustcache/original-static-system.bundle.json, dts/liuqin.dts, feeds.toml, local.toml.example, proprietary-files.txt, stubs/kernel-stub.macho, tests/run-host-test.sh, unixnu.lock. After: 141 files and 0 unowned (the three .cache entries left the index). The same audit is what the incremental checker does per changed path, so an unowned file is a guaranteed CI failure the moment anyone edits it -- feeds.toml is the proof, it only surfaced when the carrier trial changed that file." },
    { kind = "host", command = "git rm -r --cached .cache && git ls-files .cache | wc -l && git check-ignore -v .cache/firmware/trustcache/original-static-system.bundle && sha256sum .cache/firmware/trustcache/original-static-system.bundle", revision = "d6fa03f862e4647f158acbf6860164b9ae1a662a", reference = "proprietary-files.txt", result = "git ls-files .cache returns nothing after the removal, .gitignore matches the path, and the on-disk bundle still hashes to 7416ca4f8377146626bb284e2133c76bee6cb4e3ee0af5d648b186235a7323a7 -- the same value proprietary-files.txt pins and board.toml lists in [payload] trust_cache_sha256, so untracking changed no input the build reads." },
    { kind = "host", command = "python3 scripts/audit-h16f-image.py --kernel <UniXNU>/out/liuqin/kernel/kernel.macho --payload <UniXNU>/out/liuqin/payload/payload.img && python3 scripts/check-trust-cache-image.py --kernel ... --payload ...", revision = "2d35652c7bbfe6025f7abdd021a83276807b6102", reference = "docs/bringup-2026-11-21-v66-round.md", result = "AUDIT FAILED (6) and TRUST-CACHE IMAGE CHECK FAILED (1/21) against the v66 products (kernel sha256 b91c756729611065..., payload.img 17:10). Recorded so the next round starts from a corrected guard set instead of a red guard nobody trusts." },
]

[[area]]
id = "firmware"
status = "device-verified"
components = ["DarwinBoot"]
paths = ["scripts/import-liuqin-uefi.py", "scripts/gen-liuqin-memory-map.py", "docs/vendor-inputs.md", "docs/liuqin-hardware.md"]
inputs = [
    "uefi.elf (stock firmware) with 93 PE32 and 58 raw modules extracted; uefiplat.cfg hard values recorded in docs/vendor-inputs.md.",
    "Mu / Mu_Basecore + Silicium platform tree at ../uefi-liuqin; FD Build/liuqinPkg/DEBUG_CLANGPDB/FV/SILICIUM_UEFI.fd, 3145728 bytes.",
    "Cape DTB at ../uefi-liuqin/Resources/DTBs/liuqin.dtb.",
]
configuration = [
    "[firmware] config=liuqin, dsc/fd/packages/patches/preflight as recorded in board.toml.",
    "Framebuffer handoff boot args fb=0xb8000000,1800,2880,7200 (32 bpp, stride 7200 bytes).",
    "ADT built by scripts/make-liuqin-adt.py with --dram-size 0x80000000 --owned-memory-size 0x10000000 --chip-id 207 --cpu-regs 0,0x100,0x200,0x300,0x400,0x500,0x600,0x700 --ipad-identity.",
]
procedure = [
    "./unixnu build firmware",
    "./unixnu build payload --kernel out/liuqin/kernel/kernel.macho --unique-chip-id 0x84750A0B0C0D0001",
]
findings = [
    "The loader prints HANDOFF EXIT RETURN 0x0 and DARWINBOOT: hand-off to the kernel, and the kernel reports the owned trampoline at pa 0xBF224000 with entry words D2B7031A 529FFFFB 72BFE01B D2A0003C, so the EL1/EL2 state handoff (SCTLR_EL1 0x30D0198D, TCR_EL1 0x280803518, PARange 2 4 KiB granule) is usable as-is.",
    "fastboot boot accepts the full 69,525,504 byte image; the ABL buffer limit that forces flashing on tb128fu does not apply here, so no partition is ever written during bring-up.",
    "PSCI is not used on this path; CPU bring-up goes through the ADT/ArmDTPlatform handoff instead.",
]
completion = [
    "Firmware image builds, enters UniXNU, publishes the framebuffer with the recorded geometry and preserves the memory reservations declared in the ADT.",
]
limits = [
    "The FD is a debug build without vendor secure-boot inputs; ENABLE_SECUREBOOT is 0.",
]
next_action = [
    "Record the panel timing/bridge configuration from the firmware side so the display area can drop the fixed 1800x2880/7200 assumption.",
]
evidence = [
    { kind = "source", reference = "docs/vendor-inputs.md", result = "154 vendor inputs extracted from the stock UEFI plus the uefiplat.cfg values." },
    { kind = "device", command = "fastboot boot boot-liuqin-v38-chain-dump.img", revision = "1db66fc55c1582d5483ff882456a142e8f972133", reference = "docs/boot-rounds-v35-v44.md", result = "Panel: config: \\EFI\\UniXNU\\unixnu.toml, READY TO ENTERQUEST, HANDOFF EXIT RETURN 0x0, DARWINBOOT: hand-off to the kernel, video base 0xB8000000 1800x2880 row 7200 bytes 32 bpp." },
]

