    { kind = "device", command = "fastboot boot boot-liuqin-v42-relocated-bindings.img", revision = "ee2b5a8388f8038fd37e992e159a600f0e7cfeab", reference = "patches/xnu/attic/2026-11-19-h17-trust-cache-lock-init.patch", result = "NEW WALL after the root mounts: panic 'Taking non-sleepable RW lock with preemption enabled @lock_rw.c:1400', frames symbolized against the built kernel to _lck_rw_lock_shared+0x58 <- _query_trust_cache+0x70 <- AMFI (three __PLK_TEXT_EXEC frames) <- _mac_vnode_check_* <- _ubc_cs_blob_add <- _load_code_signature <- _parse_machfile <- _load_machfile <- _exec_mach_imgact <- ___mac_execve <- _load_init_program <- _bsdinit_task. That is the exec of launchd, so it happens on every boot." },
