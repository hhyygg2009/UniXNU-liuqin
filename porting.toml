findings = [
    "UFS reads, SCSI capacity, the GPT and the userdata window are correct on device; v34b already reached B94:at_pseudo with the root path enabled, and v38 reaches U59:start-root_init.",
    "The metaclass batch is the blocker, not the controller. The v38 scan named it: slot 170 of 172 is NativeUfsBlock::gMetaClass at ffffff0007ae36b0 (panel p= matches the symbol exactly, sz=248 matches the constructor's 0xf8), and its superClassLink field at +0x10 holds the ASCII bytes 'a0)\\n[ 51' instead of the family pointer, so the guard drops that one class and no block device is ever published.",
    "The link-time superclass binding is correct, so the text is a runtime scribble: the driver's MetaClass constructor loads &IOBlockStorageDevice::gMetaClass through its GOT slot at fffffff007a0c008 and that slot holds fffffff007add1d0 in the shipped image.",
    "The v36 gate is a false positive on this build: because IOStorageFamily is prelinked, the name IOBlockStorageDevice is legitimately taken, so the gate always refuses root publication (panel I60:base-dup). It converted the abort into a readable failure, which is what made the diagnosis possible, but it also permanently blocks the root.",
    "The duplicate-class theory that motivated the gate is dead: postModLoad reached the fault through the no-duplicate branch (getObject returned NULL) and our class registers under its own unique name NativeUfsBlock.",
    "Host side: the upstream descriptor oracle passes 14/14, and simtest scenario D reproduces the v37 abort (postModLoad+0x2d4, x24=0x6131373030666666) and proves the shipped scan drops only the poisoned slot while the rest of the batch still registers with correct depth semantics.",
    "v40 on device (IMG_7119-7123): the heal works in the field (M:mc pre was=0x6331323766393730 now=0xfffffff007add1d0) and the boot again ends at a readable Failed to mount root device @IOKitBSDInit.cpp:989, with no data abort. The scan reports bad=1 healed=0, so the scan only reports and the registration path repairs.",
    "The poison is named: bad=0x6331323766393730 renders as the eight bytes 079f721c, and 0xfffffff0079f721c is the start of _sysctl_register_oid_early in this exact image (llvm-nm of out/liuqin/kernel/kernel.macho, 51246 symbols; a random 8-hex-digit string lands on a symbol start about 0.3% of the time). What was written over the pointer field is the low eight hex characters of a kernel text address, formatted as text.",
    "ring clean self=0 lost=0 total=3985 does NOT exclude a console copy: only liuqin_debug_putc/puts append to the mirror, so kprintf/printf output (including the %08x prints in zzz-liuqin-usb-debug.patch) is invisible to the search. v41 hooks the console write path and prints how many bytes the mirror actually covers.",
    "ROOT CAUSE (v42, 2026-11-18): H16 was never a scribble. build-liuqin-ufs-bindings.py decoded the family metaclass, vtable and method slots out of the pinned 21H461 kernelcache and bound those original-cache VAs directly (slide = 0), but our fileset emitter moves every kext segment: __PRELINK_TEXT/__PLK_TEXT_EXEC/__PLK_DATA_CONST/__PRELINK_DATA by -0x1000000 and __PRELINK_INFO by +0x774000. So IOBlockStorageDevice::gMetaClass was pinned to 0xfffffff007add1d0, which in our image is not the family object at all but the middle of __common (0x07a50000-0x07ae3828) -- other statics' storage. The driver's superClassLink therefore pointed at unrelated bytes, the scan dereferenced them as an OSMetaClass and reported a poisoned chain whose value looked like ASCII and changed between boots (v41 saw bad=0 once and bad=1 another time), the H16-F heal wrote the same phantom back (M:mc pre now=0x07add1d0, depth=-2), and the gate compared the registry's real object (0xfffffff006add1d0) against the phantom and refused root publication. Fixed by mapping each binding through kernel.json coalesced_segments per segment, and leaving objects that live in the original kernel proper to the link instead of pinning them. Verified in the built image: gMetaClass 0xfffffff006add1d0 (= __PRELINK_DATA+0x11d0, exactly the address v41's M:alien held= reported), __ZTV20IOBlockStorageDevice 0xfffffff005cb44c0, requestIdleEv 0xfffffff00496f050; audit-h16f-image.py still 50/50 PASS.",
    "v43 RETIRED the whole H16 diagnostic apparatus (the XNU scan patch deleted, -369/+25 in NativeUfs.cpp). What remains is a tripwire, not a repair: liuqinChainDepth + liuqinMetaclassWitness report an unwalkable ancestor chain and write nothing, and the base-class gate stays because it is the invariant that made the diagnosis possible at all. Keeping the scan cost panel lines that pushed the milestones off the photo, and a diagnostic that hides the evidence is worse than none.",
    "H16 post-mortem rule for the next person: a 'who wrote this word' question is only worth asking after the address it came from has been proven to be the object you think it is. Five rounds of increasingly clever instrumentation (v36 gate, v37 guard, v38 naming, v39 repair, v40 fingerprint, v41 arithmetic) measured a phantom 16 MiB above our own __PRELINK_DATA.",
    "The blocker was base-alien, and it was arithmetic, not noise: the registry holds IOBlockStorageDevice at 0xfffffff006add1d0 while the driver links against 0xfffffff007add1d0 (= __ZN20IOBlockStorageDevice10gMetaClassE, inside __common BSS 0x07a50000-0x07ae3828). The difference is exactly 0x1000000 (16 MiB, the slide granularity) with identical low 24 bits, and 0x06add1d0 is not in any segment of the image (lowest section VMA 0xfffffff007008360), so the holder is a zone object. Either the family metaclass was copied into the zone, or a -16 MiB slide was applied on one side only (runtime-computed pointers slid, link-time immediates not).",
    "v43 on device (IMG_7179-7196, 2026-11-19 22:05): the H16 retirement worked exactly as intended -- not one M:stalled / M:bad[ / M:fp / M:alien / M:mc line anywhere in the batch, and for the first time the panel shows the real kernel console (Serial requested..., zone_init: map ..., VM bootstrap done: 39 maps 12 entries 16 holes left, OSLog stream configured...). That is the whole point of cutting a diagnostic: the flood was pushing the evidence off the photo.",
    "v43 also bought the fact the trust-cache line needed: mac_policy_initmach() (K51) calls KLDBootstrap::loadSecurityExtensions(), which starts AMFI and AppleImage4, and the trust-cache block in startup.c is K52. So img4if and amfi are registered BEFORE trust_cache_runtime_init() checks them -- the mondrian trap (img4if == NULL -> panic) does not apply to this ordering, which turns CONFIG_XNU_TRUST_CACHE_RUNTIME=y plus two real trust caches from a risky unknown into an executable next step.",
    "Boot args aimed at codeless components must be census-checked first: `strings -a kernel.macho | grep 'can't has'` returns exactly one fatal check in the whole image and it names cs_enforcement_disable. scripts/audit-h16f-image.py now pins all three facts (the arg absent from the payload, the fatal string present once, nothing refusing amfi_get_out_of_my_way).",
    "v66 on hardware (2026-11-21 20:13, IMG_7249/7250) moves the wall off H17 and off storage: no lock_rw.c:1400 anywhere on screen, the base-class tripwire reports link=0xfffffff006add1d0 for M:reg pre p=0xfffffff007ac36b0 three times -- the same address the compiled __ZN20IOBlockStorageDevice10gMetaClassE has in the image -- and the block stack now reaches two registered devices with BSD clients (MEDIA start IOBlockStorageDevice=1 ... IOMedia=3 IOMediaBSDClient=3, then IOBlockStorageDevice=2 ... IOMedia=7 IOMediaBSDClient=7, V58 sync st=0x1e dev=2 drv=2 med=3 bsd=3 mc=111 n=55). The boot then dies inside XNU's own VM telemetry: copyio.c:94 Assertion failed: __builtin_arm_rsr(\"pan\") != 0, frames symbolized against this kernel as _panic_with_data <- _copy_validate <- _telemetry_process_sample+0x11c <- _telemetry_take_sample+0x16c <- _telemetry_ast+0x164 <- _ast_taken_user+0x22c <- user_take_ast+0xc <- _fleh_synchronous+0x28. With CONFIG_XNU_NATIVE_PAN=y (configs/liuqin_boot_defconfig:15, also the upstream arm64 default) the native-arm-pan patch turns on __ARM_PAN_AVAILABLE__, so the copyio PAN assertion is live and the telemetry AST sample path performs a copy without raising PAN. Nothing in this points at the UFS driver: the gate says the binding is correct before the assert.",
    "2026-11-22 merge review of Fly116/UniXNU-liuqin@515f887 (their pong stack, iPadOS 18 / NativeUfs): their v114 reaches Failed to mount root device @IOKitBSDInit.cpp:996 and the failure is a non-completing TUR (no SCSI status at all), not media rejecting a command -- one layer earlier than anything this driver hit. Their rounds v115-v124 localize it to the hand-off: firmware leaves UFS powered down and neither PHY window answers writes, while the same-SoC zizhan board boots with a kernel that never touches UIC/PHY (its firmware hands over with UFS live). Two of their claims were re-verified here before recording: the PONGFAT1 envelope is field-for-field identical across all three of their packager scripts, and the file-offset formula in docs/v114-root-device-ufs-2026-11-22.md section 6 was wrong by 0x1000 (it said segment base ...b7a8000; only ...b7a9000 reproduces the 0x1943AD4 their own artifact table records) -- corrected in place with an erratum note, their shipped kernel bytes were patched at the right offset.",
]
completion = [
    "Host: register, clock, link and SMMU facts match the board inventory.",
    "Reads: SCSI capacity, GPT and known blocks are correct; OS/SystemOS windows stay within userdata.",
    "Root: the configured volume mounts and launchd starts. Persistence: writes survive reboot within the allocated Data region.",
]
limits = [
"v44 (boot-liuqin-v44-no-cs-disable.img, 69,525,504 B, sha256 e0632a5263..., same kernel e8233d2e as v43) is the current bench image: it only drops the boot arg AMFI refuses. Its prediction is falsifiable -- K52:trust_cache_lock_init must appear between dtrace_early_init and OSKext...KextBootstrap, and the boot must reach B19:at_mountroot without lock_rw.c:1400. If the same panic appears WITH that milestone line, it is a different non-sleepable lock and this patch must not be touched again.",
"Root mounts (device-verified on v42): root-bringup-ok, root-layout-ok, root-manifest-ok, root-plan-ok, root-iostart-ok, root-unauth-open, ac-ok, root-prepared, root-media-SystemOS, B17:ofindroot_done, B19:at_mountroot. What does NOT work yet is what comes after the mount: the exec of init. v42 died in the kernel on an uninitialised trust-cache lock (H17, fixed in the image by patches/xnu/attic/2026-11-19-h17-trust-cache-lock-init.patch, not yet device-proven); v43 died 16 stages earlier because the bring-up boot arg cs_enforcement_disable is refused by AMFI itself.",
    "v45 is a CANDIDATE, not the bench image: releases/boot-liuqin-v45-trust-cache-candidate.img passes scripts/check-trust-cache-image.py (21 items) and fails exactly the 8 audit-h16f-image.py items that assert the =n branch -- the two guards give disjoint pass sets, which is the proof the switch reached the image.",
"No write path has been exercised, so Data persistence is unverified.",
"H17 is the open question, and it is a code-signing question, not a storage one: AMFI (a codeless component -- Apple's own binary, no source in this repository) is the thing that decides whether launchd may execute. Two of its knobs were tried: amfi_get_out_of_my_way=1 has no fatal check and stays; cs_enforcement_disable=1 has exactly one (\"can't has cs_enforcement_disable\" @AppleMobileFileIntegrity.cpp:5261, reached from mac_policy_initmach -> KLDBootstrap::loadSecurityExtensions() -> OSKext::start) and is out as of v44. The honest state of the trust caches: board.toml fetches StaticTrustCache and Cryptex1,SystemTrustCache, but out/liuqin/payload/payload.json still reports trust_cache_sha256 = null, so nothing is loaded and no cdhash can be judged trusted.",
    "The driver-side history of H16 is only partly public: gitlink 26ae865ea314 and the v39 line adc855a5a05a resolve on https://github.com/Fly116/ShengUfs, but the v36-v42 commits the rounds document describes live in the maintainer's private clone, so that intermediate source cannot be inspected by a reader.",
    "Root mount is still not reached: the boot stops in the telemetry AST path before the root decision, so the v66 round proves the block stack registers but says nothing about mounting or persistence.",
    "The device-repo commit behind the 17:10 v66 build is not recorded anywhere (build/boot.json and build/NOTES.md still describe the 11-19 v1 image, and v60-v66 have no provenance file), so this round's evidence cites the published repository revision for the tooling plus the image and kernel sha256 for the bytes that actually ran.",
]
next_action = [
"Boot boot-liuqin-v44-no-cs-disable.img (69,525,504 B, sha256 e0632a5263fc44463e941dd6ff776667e77263e6ca74241b493b4e914a19c26f) -- releases/watch-v44-loop.sh does it automatically, and that fastbuild needs `fastboot -s <serial>`, not the old positional form -- and read releases/v44-NOTES.md. First line to look for is K52:trust_cache_lock_init between dtrace_early_init and OSKext...KextBootstrap (the panel proof the patched #else branch ran, never yet seen on device); then whether the boot reaches B19:at_mountroot and what comes after it. If lock_rw.c:1400 reappears WITH that milestone present, it is a different non-sleepable lock: re-symbolize the frames and find that lock's owner instead of touching this patch again.",
    "Read v44 on hardware first (H17 has no device proof yet), then decide on the TC candidate: releases/boot-liuqin-v45-trust-cache-candidate.img (69,525,504 B, sha256 11998ba9d7..., kernel d19280cf) compiles the =y branch and carries the 2,554 original cdhashes, and docs/trust-cache-plan.md holds its falsifiable reading table. The two rounds are mutually exclusive at compile time, so v45 cannot vouch for v44. Only after a clean TC round does amfi_get_out_of_my_way=1 come out (v46, one variable).",
    "Fix the recorded-vs-actual configuration: board.toml declares defconfig = liuqin_defconfig while out/liuqin/.config is byte-identical to configs/liuqin_boot_defconfig (and that is where CONFIG_XNU_TRUST_CACHE_RUNTIME=n comes from). Either make the build regenerate .config when the declared defconfig changes, or declare what is actually used -- but do not leave a board.toml that the next round will trust and be wrong about.",
    "Publish the private driver line (push 433e7fdd5735, 8abb519365d7, 91c6fcc35d1c and c36c575fe0a0 as branches of Fly116/ShengUfs or hhyygg2009/ShengUfs) so every H16 citation resolves to a blob; until then the rounds document carries them and no evidence item may present those SHAs as inspectable source.",
    "Find how the VM telemetry AST gets armed in the XNU source (act_set_io_telemetry_ast / act_set_macf_telemetry_ast / telemetry_process_sample and their enable conditions or boot args -- the image carries com.apple.xnu.vmtc_telemetry, telemetry_sample_rate and io_telemetry_limit), then run one switch-flip round with the mutually exclusive guard pair, so the next wall is either gone or reduced to a single explained assertion.",
    "Cross-check the pong stack's NativeUfs transport against this driver's proven paths: Fly116 merged v106-v124 bring-up on iPadOS 18 whose only blocker is now the same controller -- its TUR probe never completes (ocs=0f, db=1 uncleared, polls=1589) and rounds v119-v124 show the firmware hands over with UFS powered down (GDSC off, all clock gates set, QMP PHY pwrdn=1, PHY windows at 0x1d80000 and 0x1d87000 both ignore writes). ShengUfs completes commands on this board, so the diff list in docs/ufs-tur-analysis-2026-11-22.md section 2.1 (UIC channel bring-up, doorbell/pause policy, queue restart) plus the UEFI UfsDxe UIC order is the checklist; their next probe is an RPMh vdda-phy/vdda-pll vote before programming PHY tables.",
]
evidence = [
    { kind = "source", reference = "https://github.com/Fly116/ShengUfs/blob/26ae865ea31492cb9f156621a04acc2effff1092/NativeUfs.cpp", result = "The driver as published at the recorded gitlink (blob 613289ade6d8554b7aee9079a9f623fc6af45bd7, 202,343 bytes): NativeUfsBlock::startRoot, the block-class gate liuqinBlockSuperClass / liuqinBlockAdoptSuperClass / liuqinBlockChainOk reading the metaclass layout (vtable +0x00, reserved +0x08, superClassLink +0x10, className +0x18), and the liuqin_milestone / liuqin_debug_puts plumbing." },
    { kind = "source", reference = "docs/boot-rounds-v35-v44.md", result = "v36 to v42 ran the same gate under the private-line names liuqinBaseClassFree, liuqinBaseClassCheck, liuqin_block_super_fix, liuqinMetaclassWitness and liuqinMetaclassPoisonReport. None of those symbols, and none of the driver commits 433e7fdd5735, 91c6fcc35d1c, c36c575fe0a0 or 8abb519365d7, exist in the public Fly116/ShengUfs repository, so the rounds document is the only public record of what that code printed and decided." },
    { kind = "source", reference = "docs/boot-rounds-v35-v44.md", result = "Retired in v43: the H16-E scan (per-slot naming, bounded chain validation, skip-instead-of-refuse, summary line last) shipped as patches/xnu/zzzzzzzzzz-liuqin-metaclass-stalled-diagnostics.patch from v37 to v42 and was deleted once v42 proved there was no scribble to find. The rounds document is the surviving record of what it printed." },
    { kind = "host", command = "python3 drivers/ShengUfs/tests/check_legacy_descriptors.py --output /tmp/out --compiler g++", revision = "1db66fc55c1582d5483ff882456a142e8f972133", reference = "https://github.com/Fly116/ShengUfs/blob/26ae865ea31492cb9f156621a04acc2effff1092/tests/check_legacy_descriptors.py", result = "PASS 14 legacy/current descriptor comparisons. Blob 654934e7f0f6aef48e71ab7e8ccfa727ecbdd744 is byte-identical at the gitlink this run used (433e7fdd5735, unpublished) and at the published commit linked here, so the permalink shows exactly the code that ran." },
    { kind = "host", command = "tests/metaclass-simtest/run.sh", revision = "cbbb7b13e5ebe51bd2f02c716455d04f37feacfe", reference = "tests/metaclass-simtest/sim.cpp", result = "ALL SIM ASSERTIONS PASS, including D1 (v37 abort reproduced) and D2 (v38 scan drops exactly one slot)." },
    { kind = "device", command = "fastboot boot boot-liuqin-v38-chain-dump.img", revision = "1db66fc55c1582d5483ff882456a142e8f972133", reference = "docs/boot-rounds-v35-v44.md", result = "M:bad[170] bad-chain p=0xfffffff007ae36b0 vt=0xfffffff0072086d0 sz=248 n=NativeUfsBlock bad=0x3135205b0a293061; M:stalled scan BAD cnt=1; U59:start-root_init then I60:base-dup; Failed to mount root device @IOKitBSDInit.cpp:989." },
    { kind = "source", reference = "https://github.com/Fly116/ShengUfs/blob/adc855a5a05ac103fb1e9c49d2fcafb4d5ccd1dc/NativeUfs.cpp", result = "v39 (H16-F) as published on the liuqin-sm8475-v39 branch (blob 2b164e07039bfcc05265c041f152f85c84466ad1, 160,733 bytes): the controlled superClassLink repair under its public names liuqinBlockSuperClass / liuqinBlockAdoptSuperClass / liuqinBlockChainOk, with the H16-F comment block naming the metaclass field layout. The tree this board actually booted at v39 (driver commit c36c575fe0a0, reachable from no public remote) made the same decision through liuqin_block_super_fix / liuqinBaseClassCheck / liuqinMetaclassWitness; docs/boot-rounds-v35-v44.md keeps the round-by-round print." },
    { kind = "host", command = "./unixnu build kernel && python3 scripts/audit-h16f-image.py", revision = "f78ad26ba7a765dadc7af9317574f8b8a923dd00", reference = "scripts/audit-h16f-image.py", result = "AUDIT PASS 12/12 on kernel.macho sha256 b261c1b60e97c7a47ca740470c6e0570dba35ddc3e4a9e9546d9be26e2422671: hook global 0xfffffff007adfcb8; postModLoad +0x36c slot load, +0x380 blr, +0x384 image-floor compare, +0x394 str x0,[x28,#0x10], +0x3a0 second chain walk, two slot_dump branches; metaclass ctor passes 0xf8 and stores &liuqin_block_super_fix (adr -19132 -> 0xfffffff0079d5750) into the hook slot." },
    { kind = "host", command = "tests/metaclass-simtest/run.sh", revision = "f78ad26ba7a765dadc7af9317574f8b8a923dd00", reference = "tests/metaclass-simtest/sim.cpp", result = "ALL SIM ASSERTIONS PASS: A, B (base-ok / base-abi / base-alien), C, D1/D2, E1 healed-and-registered, E2 witness repairs, E3 refuses an unwalkable pointer, E4 exact name match." },
    { kind = "source", reference = "docs/boot-rounds-v35-v44.md", result = "v40 (H16-G): liuqinEightText rendered the poison in memory order, liuqinRingFind searched the console mirror through liuqin_debug_copy only (256-byte chunks, seven-byte rewind, capped rounds, no pointer dereference) and liuqinMetaclassPoisonReport searched before it printed, classifying candidates inside its own lines as self=; installed in the same metaclass constructor as the repair. Driver commit 8abb519365d7 is unpublished and the code was retired in v43, so the citation is the rounds document rather than a blob." },
    { kind = "host", command = "./unixnu build kernel && python3 scripts/audit-h16f-image.py", revision = "8c391866a0acb3a0c24da45e32b444a9372bac5a", reference = "scripts/audit-h16f-image.py", result = "AUDIT PASS 42/42 on kernel.macho sha256 0f6b131d70fc230b240662f13db7498eec0541e993a875113ce487ec0b823c3d: report hook slot 0xfffffff007adfcc0, helper 0xfffffff007892d6c loads it, bails, counts and tail-jumps (br x3); postModLoad calls the helper at +0x374, strictly before the repair slot load at +0x37c; the ctor stores &liuqinMetaclassPoisonReport (0xfffffff0079d58c8) into the slot; four liuqin_debug_copy and one liuqin_debug_total inside the report body; three puts inside the witness, so the replay line is real." },
    { kind = "host", command = "tests/metaclass-simtest/run.sh", revision = "8c391866a0acb3a0c24da45e32b444a9372bac5a", reference = "tests/metaclass-simtest/sim.cpp", result = "ALL SIM ASSERTIONS PASS including F1-F7: producer found with byte-exact at/after/total, fingerprint strictly before the repair, printable needle judged clean then self=1 (no self-hit), wrapped ring reported as lost, offsets taken from the real base after a wrap, lock contention giving up in one copy, two fingerprints then silence, hookless board identical to v39, evidence replayed at pub only. ring.inc and report.inc are extracted from the XNU patches, so the harness searches the kernel's own ring code." },
    { kind = "host", command = "git apply --reverse --check / --check / round-trip on libkern/c++/OSMetaClass.cpp", revision = "8c391866a0acb3a0c24da45e32b444a9372bac5a", reference = "docs/boot-rounds-v35-v44.md", result = "The round-trip proof that kept the H16-E scan honest while it shipped (reverse-check ok on the built tree, forward-check ok on the result, re-apply byte-identical). The patch itself is gone as of v43; the same replay discipline is what v43's own patch was checked with." },
