# 面板判读规则 —— docs/panel-rules.toml
#
# scripts/read-panel.py --round <r> 用这份表把照片变成结论。规则不是抄 NOTES 的文字：
# 每一条都对应 releases/<r>-NOTES.md 判读表的一格，改那一格就改这一条。
# require/forbid 是对**已复原行**的正则（EXACT/FIXED/SYMS/AMBIG/OPEN 都算，RAW 也算原文）；
# check 从行里取 key=value 比较，op 缺省是 ==。
# [[signal]] 列这一轮**期望看到**的行，照片里没有就打 MISSING —— 缺哪一行往往就是答案。

[[rule]]
round = "v40"
id = "producer-named"
verdict = "生产者点名：ctx 那行就是被复制进 superClassLink 的文本"
next = "按 ctx 里的文本找写它的代码；after= 给出它与扫描之间的字节数，用来定位窗口"
require = ['M:bad\[170\].*fixed', 'M:scan done bad=0 healed=[1-9]', 'M:fp scan ring hits=[1-9]']

[[rule]]
round = "v40"
id = "self-copy"
verdict = "命中的是我们自己已经打印过的里程碑（复制旧缓冲），不是外部涂写"
next = "拿 ctx 里的 at= 与镜像偏移对照，找那条 memcpy 的目标/源"
require = ['M:fp scan ring hits=[1-9]', 'M:fp scan ctx\|\s*(M:stalled|M:mc|U[0-9]+:|B[0-9]+:)']

[[rule]]
round = "v40"
id = "not-console-text"
verdict = "毒值不是控制台文本的复制（ring clean，self=0）"
next = "回到 v39 前的另一条假设：构造函数参数本身就是垃圾 / 外部乱写，改用「参数与钩子来源」对照"
require = ['M:bad\[170\].*fixed', 'M:fp scan ring clean self=0']

[[rule]]
round = "v40"
id = "ring-wrapped"
verdict = "镜像绕回了：可能回答问题的字节已经被覆盖，clean 不成立"
next = "把搜索提前到第一次撞坏链时；或先拉大 LQ_RING_SIZE；同时用 USB 调试口把全环拉下来离线搜"
require = ['M:bad\[170\]', 'M:fp scan ring lost=[1-9]']

[[rule]]
round = "v40"
id = "writer-under-lock"
verdict = "搜索时 log_lock 被占着（gaveup）—— 反过来证明涂写发生在持锁路径上"
next = "下一轮改成先拷快照再离线搜"
require = ['M:fp scan ring gaveup']

[[rule]]
round = "v40"
id = "attribution-too-weak"
verdict = "分类器把真生产者判成了我们自己（self>=1 且 hits=0）"
next = "归属法要更强：记行首，而不是找 asc=\"/bad="
require = ['M:fp scan ring clean self=[1-9]', 'M:fp scan ring hits=0']

[[rule]]
round = "v40"
id = "writer-still-active"
verdict = "扫描时字段是好的，涂写发生在挂载窗口内（只有 M:fp pub）"
next = "v39 判读表里「涂写者仍在活动」那一格，现在带了窗口与文本：在挂载路径上找写手"
require = ['M:fp pub']
forbid = ['M:fp scan ring', 'M:fp scan p=']

[[rule]]
round = "v40"
id = "hook-missing"
verdict = "有 fixed 但完全没有 M:fp —— 钩子没装或驱动没跑到报告函数"
next = "llvm-nm 复核 ctor 里那条 str x9,[x8,#0xcc0] 与 adr → 0xfffffff0079d58c8"
require = ['M:bad\[170\].*fixed']
forbid = ['M:fp']

[[rule]]
round = "v40"
id = "past-the-mount"
verdict = "登记路径成立，越过 Failed to mount root device：第一次看到挂载的真实结果"
next = "按挂载的具体失败点查 APFS/卷 UUID；H16 这条可以归档了"
require = ['U:base-ok|base-ok', 'live size 248, compiled size 248']

# 期望出现的行（不是判读格，缺一行就是一条线索）
[[signal]]
round = "v40"
name = "M:fp scan p=…asc=…"
pattern = 'M:fp scan p=0x'
[[signal]]
round = "v40"
name = "M:fp scan ring …"
pattern = 'M:fp scan ring'
[[signal]]
round = "v40"
name = "M:fp scan ctx|…|"
pattern = 'M:fp scan ctx\|'
[[signal]]
round = "v40"
name = "M:bad[170] fixed"
pattern = 'M:bad\[170\].*fixed'
[[signal]]
round = "v40"
name = "M:scan done"
pattern = 'M:scan done bad=\d+ healed=\d+'
[[signal]]
round = "v40"
name = "M:mc pre / pub"
pattern = 'M:mc (pre|pub)'
[[signal]]
round = "v40"
name = "U:base-ok（登记成功）"
pattern = 'base-ok'
[[signal]]
round = "v40"
name = "挂载结果"
pattern = 'Failed to mount root device|at_vfsroot|root-bringup-ok'

# ---------------------------------------------------------------------------
# v41 (H16-H)：base-alien 的三种解释，一次照片分开
# ---------------------------------------------------------------------------

[[rule]]
round = "v41"
id = "one-sided-slide"
verdict = "注册表存的是 slide 之后的指针，编译期立即数没有 slide（delta 是负的且 slide 非零）"
next = "gate 不能按链接期地址比：把 want 也加上 vm_kernel_slide 再比，或改成按内容/祖先认类。v42 定案"
require = ['M:alien delta=-[0-9]+ slide=(?!0x0)']

[[rule]]
round = "v41"
id = "zone-copy"
verdict = "家族对象被复制进 zone：内容逐字节相同，只是地址差 16 MiB"
next = "按名字+classSize+祖先链认家族，别按地址；根这一步就能过去"
require = ['M:alien delta=-16777216 slide=0x0 cmp=0']

[[rule]]
round = "v41"
id = "other-class-holds-name"
verdict = "确实有另一个类持有 IOBlockStorageDevice 这个名字（cmp=1，off 指出第一个不同的字节）"
next = "按 off/a/b 反推那个对象是什么（前 64 字节里 vtable 与 className 最能定身份）"
require = ['M:alien delta=.* cmp=1 off=0x']

[[rule]]
round = "v41"
id = "wild-registry"
verdict = "持有者指针没过镜像下限守卫（cmp=-1）：注册表里是野值，回到涂写这条线"
next = "把 getMetaClassWithName 的返回路径也上钩子，看它在什么时候被写坏"
require = ['M:alien delta=.* cmp=-1']

[[rule]]
round = "v41"
id = "report-not-shipped"
verdict = "走到了 base-alien 却完全没有 M:alien —— 报告没进像或没跑到那一行"
next = "先跑 scripts/audit-h16f-image.py 的 H16-H 段，再确认 liuqinAlienReport 的调用在里程碑之后"
require = ['base-alien']
forbid = ['M:alien']

[[rule]]
round = "v41"
id = "gate-passed"
verdict = "gate 过了（base-ok / base-abi）：这一轮的问题不再是家族身份"
next = "看挂载的真实结果：U:base-ok 之后走到哪一步、Failed to mount 的行号变没变"
require = ['base-ok|base-abi']
forbid = ['base-alien']

[[signal]]
round = "v41"
name = "M:alien held …"
pattern = 'M:alien held p=0x'
[[signal]]
round = "v41"
name = "M:alien want …"
pattern = 'M:alien want p=0x'
[[signal]]
round = "v41"
name = "M:alien delta=… slide=… cmp=…（决定性一行）"
pattern = 'M:alien delta='
[[signal]]
round = "v41"
name = "U61:base-alien"
pattern = 'base-alien'

# ---------------------------------------------------------------------------
# v42（绑定按段映射）：H16 的结案判决，以及新墙 H17
# ---------------------------------------------------------------------------
[[rule]]
round = "v42"
id = "h16-closed"
verdict = "H16 结案：幻影地址消失，gate 第一次放行（live size == compiled size + base-ok）"
next = "存储这条线到此为止；看 at_mountroot 之后走到哪"
require = ['base-ok', 'live size ([0-9]+), compiled size']
forbid = ['M:fp', 'M:alien', 'M:bad\[']

[[rule]]
round = "v42"
id = "root-mounted"
verdict = "根卷第一次挂上：越过 Failed to mount root device，出现 root-bringup/layout/manifest/plan 与 at_mountroot"
next = "下一件事在 exec init（AMFI/trust cache），不在 IOKit"
require = ['root-bringup-ok', 'root-prepared', 'at_mountroot']
forbid = ['Failed to mount root device']

[[rule]]
round = "v42"
id = "method-slot-relocation-wrong"
verdict = "反证条件：崩在 0xfffffff00496… 段内 —— kext 侧方法槽不该位移"
next = "回滚到只位移四条数据符号（emitted），方法槽保留原厂值"
require = ['pc 0xfffffff00496']

[[signal]]
round = "v42"
name = "U61:base-ok"
pattern = 'base-ok'
[[signal]]
round = "v42"
name = "ABI 证据行（live/compiled size）"
pattern = 'live size [0-9]+, compiled size [0-9]+'
[[signal]]
round = "v42"
name = "非睡眠锁 panic（H17 的墙）"
pattern = 'Taking non-sleepable RW lock with preemption enabled'

# ---------------------------------------------------------------------------
# v43（H17 修复 + 剪诊断）：trust_cache_lock_init 是这一轮唯一的新证据
# ---------------------------------------------------------------------------
[[rule]]
round = "v43"
id = "h17-patch-ran"
verdict = "补丁那条 #else 分支跑了：面板出现 trust_cache_lock_init"
next = "看 exec init 之后：没有 lock_rw.c:1400 就说明这把锁就是元凶"
require = ['trust_cache_lock_init']

[[rule]]
round = "v43"
id = "h17-closed"
verdict = "H17 结案：init 的 exec 过了，at_mountroot 之后出现新的用户态里程碑"
next = "战线移到用户态（launchd/签名判决）；撤掉 amfi_get_out_of_my_way 之前先把 TC 打进 payload"
require = ['at_mountroot', 'trust_cache_lock_init']
forbid = ['lock_rw\.c:1400']

[[rule]]
round = "v43"
id = "another-nonsleepable-lock"
verdict = "反证：已有 trust_cache_lock_init 却仍然 lock_rw.c:1400 —— 炸的是另一把非睡眠锁"
next = "把 21 帧重新符号化（llvm-nm -m + 二分），按新地址定位那把锁的持有者"
require = ['trust_cache_lock_init', 'lock_rw\.c:1400']

[[rule]]
round = "v43"
id = "patch-not-shipped"
verdict = "面板里没有 trust_cache_lock_init，K 编号也没位移：补丁没进像"
next = "先跑 scripts/audit-h16f-image.py 的 K 段（lck_rw_init 的 adrp/add/bl），再决定重打"
forbid = ['trust_cache_lock_init']

[[rule]]
round = "v43"
id = "img4-amfi-wall"
verdict = "撞到 img4if/amfi 未注册那一类：TC 进 payload 从下一步变成硬前置"
next = "CONFIG_XNU_TRUST_CACHE_RUNTIME=y + 把两份 IPSW trust cache 打进 payload（trust_cache_sha256 现在是 null）"
require = ['AppleImage4|img4|unable to query trust caches']

[[rule]]
round = "v43"
id = "diagnostics-removed"
verdict = "剪诊断生效：整页没有 M:stalled/M:fp/M:alien，里程碑不再被顶出屏幕"
next = "这是 v43 的期望状态，不需要动作（若还有 M: 行 = 刷的是旧镜像）"
forbid = ['M:stalled', 'M:fp ', 'M:alien', 'M:scan done']

[[signal]]
round = "v43"
name = "K5x:trust_cache_lock_init"
pattern = 'trust_cache_lock_init'
[[signal]]
round = "v43"
name = "根挂上（at_mountroot）"
pattern = 'at_mountroot'
[[signal]]
round = "v43"
name = "H17 的旧 panic 行"
pattern = 'lock_rw\.c:1400'
